[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chromadb-repo-indexer"
version = "1.0.0"
description = "Synchronize repository text into a remote ChromaDB collection"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "UnitVectorY Labs" }]
dependencies = [
  "binaryornot==0.6.0",
  "charset-normalizer==3.4.3",
  "chromadb==1.5.9",
  "httpx==0.28.1",
  "llama-index-core==0.14.23",
  "pathspec==0.12.1",
  "PyYAML==6.0.2",
  "tree-sitter-language-pack==1.13.2",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
]

[project.scripts]
chromadb-repo-indexer = "chromadb_repo_indexer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chromadb_repo_indexer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
