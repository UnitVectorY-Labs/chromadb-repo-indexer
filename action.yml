name: ChromaDB Repository Indexer
description: Synchronize repository text into a remote ChromaDB collection
author: UnitVectorY Labs
inputs:
  server-url:
    description: Full HTTP(S) Chroma server URL
    required: true
  collection-name:
    description: Shared Chroma collection name
    required: true
  bearer-token:
    description: Optional static bearer token
    required: false
    default: ""
  tenant:
    description: Existing Chroma tenant
    required: false
    default: default_tenant
  database:
    description: Existing Chroma database
    required: false
    default: default_database
  config-file:
    description: Root-relative YAML configuration file
    required: false
    default: ""
  include-paths:
    description: Newline-separated Git wildmatch include patterns
    required: false
    default: ""
  exclude-paths:
    description: Newline-separated Git wildmatch exclude patterns
    required: false
    default: ""
  include-extensions:
    description: Newline-separated extension allowlist
    required: false
    default: ""
  exclude-extensions:
    description: Newline-separated extension denylist
    required: false
    default: ""
  chunk-size:
    description: Maximum tokens per chunk including context prefix
    required: false
    default: "512"
  chunk-overlap:
    description: Overlap tokens when subdividing an oversized unit
    required: false
    default: "64"
  batch-size:
    description: Requested Chroma mutation batch size
    required: false
    default: "100"
  dry-run:
    description: Plan changes without mutating Chroma
    required: false
    default: "false"
  embedding-api-url:
    description: Optional OpenAI-compatible embeddings API origin
    required: false
    default: ""
  embedding-model:
    description: Optional model name for the embeddings API
    required: false
    default: ""
  embedding-api-key:
    description: Optional API key for the embeddings API
    required: false
    default: ""
outputs:
  namespace_id:
    description: Deterministic namespace hash
    value: ${{ steps.index.outputs.namespace_id }}
  files_scanned:
    description: Regular files inspected
    value: ${{ steps.index.outputs.files_scanned }}
  files_eligible:
    description: Files selected by filters
    value: ${{ steps.index.outputs.files_eligible }}
  files_indexed:
    description: Non-empty text files indexed
    value: ${{ steps.index.outputs.files_indexed }}
  files_binary_skipped:
    description: Binary or undecodable files skipped
    value: ${{ steps.index.outputs.files_binary_skipped }}
  files_other_skipped:
    description: Symlinks and non-regular entries skipped
    value: ${{ steps.index.outputs.files_other_skipped }}
  chunks_desired:
    description: Desired record count
    value: ${{ steps.index.outputs.chunks_desired }}
  chunks_added_or_updated:
    description: Added or updated record count
    value: ${{ steps.index.outputs.chunks_added_or_updated }}
  chunks_unchanged:
    description: Unchanged record count
    value: ${{ steps.index.outputs.chunks_unchanged }}
  chunks_deleted:
    description: Deleted stale record count
    value: ${{ steps.index.outputs.chunks_deleted }}
  dry_run:
    description: Whether mutations were disabled
    value: ${{ steps.index.outputs.dry_run }}
  duration_ms:
    description: Run duration in milliseconds
    value: ${{ steps.index.outputs.duration_ms }}
  summary:
    description: Complete JSON run summary
    value: ${{ steps.index.outputs.summary }}
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.11.32"
        working-directory: ${{ github.action_path }}
        enable-cache: "true"
        cache-python: "true"
        cache-suffix: chromadb-repo-indexer-v1
        ignore-nothing-to-cache: "true"

    - name: Install Python
      shell: bash
      run: uv python install 3.14

    - name: Install indexer dependencies
      shell: bash
      run: uv sync --project "${GITHUB_ACTION_PATH}" --frozen --no-dev --no-editable

    - name: Restore Tree-sitter grammars
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/tree-sitter-language-pack
        key: tree-sitter-language-pack-1.13.4-${{ runner.os }}-${{ runner.arch }}

    - name: Install Tree-sitter grammars
      shell: bash
      run: >-
        uv run --project "${GITHUB_ACTION_PATH}" --frozen --no-sync python -c
        "from tree_sitter_language_pack import prefetch;
        prefetch(['bash','c','cpp','csharp','css','go','html','java','javascript','json','kotlin','lua','php','python','ruby','rust','sql','swift','toml','tsx','typescript','vue','xml','yaml'])"

    - name: Index repository
      id: index
      shell: bash
      env:
        INPUT_SERVER_URL: ${{ inputs.server-url }}
        INPUT_COLLECTION_NAME: ${{ inputs.collection-name }}
        INPUT_BEARER_TOKEN: ${{ inputs.bearer-token }}
        INPUT_TENANT: ${{ inputs.tenant }}
        INPUT_DATABASE: ${{ inputs.database }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_INCLUDE_PATHS: ${{ inputs.include-paths }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_INCLUDE_EXTENSIONS: ${{ inputs.include-extensions }}
        INPUT_EXCLUDE_EXTENSIONS: ${{ inputs.exclude-extensions }}
        INPUT_CHUNK_SIZE: ${{ inputs.chunk-size }}
        INPUT_CHUNK_OVERLAP: ${{ inputs.chunk-overlap }}
        INPUT_BATCH_SIZE: ${{ inputs.batch-size }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_EMBEDDING_API_URL: ${{ inputs.embedding-api-url }}
        INPUT_EMBEDDING_MODEL: ${{ inputs.embedding-model }}
        INPUT_EMBEDDING_API_KEY: ${{ inputs.embedding-api-key }}
      run: >-
        uv run --project "${GITHUB_ACTION_PATH}" --frozen --no-sync
        python -m chromadb_repo_indexer.action
branding:
  icon: database
  color: purple
